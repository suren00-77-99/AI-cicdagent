name: AI DevOps Agent Test

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test-failure:
    runs-on: ubuntu-latest

    steps:

      - name: Generate test failure
        run: |
          echo "Starting deployment..."
          echo "Connecting to database..."
          echo "ERROR: Database connection refused"
          echo "ERROR: Unable to connect to database on port 5432"
          exit 1

      - name: Collect failure information
        if: failure()
        run: |
          echo "================================"
          echo "PIPELINE FAILED"
          echo "================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: Collect GitHub job logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ai-agent-output

          echo "Downloading GitHub Actions logs..."

          gh run view "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --log-failed > ai-agent-output/failed-job.log

          echo "================================"
          echo "FAILED JOB LOG"
          echo "================================"

          cat ai-agent-output/failed-job.log



      - name: Create AI Agent input
        if: failure()
        run: |
          cat > ai-agent-output/context.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "workflow": "$GITHUB_WORKFLOW",
            "branch": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID"
          }
          EOF

          echo "================================"
          echo "AI AGENT INPUT"
          echo "================================"

          cat ai-agent-output/context.json

      - name: Upload AI Agent input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-input
          path: ai-agent-output/