name: AI DevOps Agent Test

on:
  workflow_dispatch:

jobs:
  test-failure:
    runs-on: ubuntu-latest

    steps:

      - name: Generate test failure
        run: |
          echo "Starting deployment..."
          echo "Connecting to database..."
          echo "ERROR: Database connection refused"
          echo "ERROR: Unable to connect to database on port 5432"
          exit 1

      - name: Collect failure information
        if: failure()
        run: |
          echo "================================"
          echo "PIPELINE FAILED"
          echo "================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"

      - name: Save failure context
        if: failure()
        run: |
          mkdir -p ai-agent-output

          cat > ai-agent-output/context.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "workflow": "$GITHUB_WORKFLOW",
            "branch": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID",
            "job": "test-failure"
          }
          EOF

          echo "AI Agent context:"
          cat ai-agent-output/context.json

      - name: Upload failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-failure-context
          path: ai-agent-output/