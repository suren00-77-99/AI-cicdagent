name: AI DevOps Agent Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-failure:
    runs-on: ubuntu-latest

    steps:

      - name: Generate test failure
        id: failure
        continue-on-error: true
        run: |
          mkdir -p ai-agent-output

          {
            echo "Starting deployment..."
            echo "Connecting to database..."
            echo "ERROR: Database connection refused"
            echo "ERROR: Unable to connect to database on port 5432"
            echo "Error: Process completed with exit code 1."
          } | tee ai-agent-output/failed-job.log

          exit 1

      - name: Collect failure information
        if: steps.failure.outcome == 'failure'
        run: |
          echo "================================"
          echo "PIPELINE FAILED"
          echo "================================"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run ID: $GITHUB_RUN_ID"

      - name: Create AI Agent context
        if: steps.failure.outcome == 'failure'
        run: |
          cat > ai-agent-output/context.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "workflow": "$GITHUB_WORKFLOW",
            "branch": "$GITHUB_REF_NAME",
            "commit": "$GITHUB_SHA",
            "run_id": "$GITHUB_RUN_ID",
            "job": "test-failure"
          }
          EOF

          echo "================================"
          echo "AI AGENT INPUT"
          echo "================================"

          cat ai-agent-output/context.json

      - name: Display captured logs
        if: steps.failure.outcome == 'failure'
        run: |
          echo "================================"
          echo "CAPTURED PIPELINE LOG"
          echo "================================"

          cat ai-agent-output/failed-job.log

      - name: Upload AI Agent input
        if: steps.failure.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-input
          path: ai-agent-output/